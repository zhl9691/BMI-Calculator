<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="一个简单的 BMI（身体质量指数）计算器" />
  <title>BMI 计算器</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #ffffff 0, #eef4ff 45%, #f6f8fc 100%);
    }
    .card {
      width: min(100%, 440px);
      background: rgba(255,255,255,.96);
      border: 1px solid #e5eaf2;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 22px 60px rgba(42, 63, 102, .12);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { margin: 0 0 24px; color: #68748a; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    .field { position: relative; }
    input {
      width: 100%;
      padding: 13px 56px 13px 14px;
      border: 1px solid #ccd5e3;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: .2s ease;
      background: #fff;
    }
    input:focus { border-color: #456ee8; box-shadow: 0 0 0 4px rgba(69,110,232,.10); }
    .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #8290a8; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      background: #315fd5;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(.97); }
    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #f4f7ff;
      border: 1px solid #dfe7ff;
    }
    .bmi { font-size: 34px; font-weight: 900; margin: 2px 0 4px; }
    .category { font-weight: 800; }
    .error { min-height: 22px; margin-top: 12px; color: #b42318; font-size: 14px; }
    .scale {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e8edf5;
      color: #657189;
      font-size: 14px;
      line-height: 1.75;
    }
    .note { margin-top: 12px; color: #8792a6; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>BMI 计算器</h1>
    <p class="subtitle">输入你的身高和体重，快速计算身体质量指数（BMI）。</p>

    <label for="height">身高</label>
    <div class="field">
      <input id="height" type="number" inputmode="decimal" min="50" max="250" step="0.1" placeholder="例如：175" />
      <span class="unit">cm</span>
    </div>

    <label for="weight">体重</label>
    <div class="field">
      <input id="weight" type="number" inputmode="decimal" min="10" max="500" step="0.1" placeholder="例如：70" />
      <span class="unit">kg</span>
    </div>

    <button id="calculate" type="button">计算 BMI</button>
    <div id="error" class="error" aria-live="polite"></div>

    <section id="result" class="result" aria-live="polite">
      <div>你的 BMI</div>
      <div id="bmi" class="bmi">--</div>
      <div>分类：<span id="category" class="category">--</span></div>
    </section>

    <div class="scale">
      <strong>参考分类：</strong><br />
      &lt; 18.5：偏瘦<br />
      18.5–23.9：正常<br />
      24.0–27.9：超重<br />
      ≥ 28.0：肥胖
    </div>
    <p class="note">BMI 只是一个粗略的体重筛查指标，不能替代专业医疗评估。</p>
  </main>

  <script>
    const heightInput = document.getElementById('height');
    const weightInput = document.getElementById('weight');
    const button = document.getElementById('calculate');
    const result = document.getElementById('result');
    const bmiText = document.getElementById('bmi');
    const categoryText = document.getElementById('category');
    const errorText = document.getElementById('error');

    function getCategory(bmi) {
      if (bmi < 18.5) return '偏瘦';
      if (bmi < 24) return '正常';
      if (bmi < 28) return '超重';
      return '肥胖';
    }

    function calculateBMI() {
      const heightCm = Number(heightInput.value);
      const weightKg = Number(weightInput.value);

      errorText.textContent = '';
      result.style.display = 'none';

      if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) {
        errorText.textContent = '请输入有效的身高和体重。';
        return;
      }

      if (heightCm < 50 || heightCm > 250 || weightKg < 10 || weightKg > 500) {
        errorText.textContent = '输入数值似乎超出常见范围，请检查后重试。';
        return;
      }

      const heightM = heightCm / 100;
      const bmi = weightKg / (heightM * heightM);

      bmiText.textContent = bmi.toFixed(1);
      categoryText.textContent = getCategory(bmi);
      result.style.display = 'block';
    }

    button.addEventListener('click', calculateBMI);
    [heightInput, weightInput].forEach(input => {
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') calculateBMI();
      });
    });
  </script>
</body>
</html>
